name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      GOOGLE_GENAI_USE_VERTEXAI: 'true'
      GOOGLE_CLOUD_PROJECT: 'hackathon-y26'
      GOOGLE_CLOUD_LOCATION: 'global'

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Run Ruff (Formatting/Linting)
        run: uv run ruff check .

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Run Tests with Coverage
        run: uv run pytest --cov=app --cov-fail-under=80

      - name: Run Evaluator
        run: |
          if [ -n "$GOOGLE_CLOUD_PROJECT" ]; then
            uvx google-agents-cli eval run
          else
            echo "Skipping evals: Google Cloud Auth not configured in CI yet."
          fi
