<!DOCTYPE html>
<html>
<head>
    <title>Cymbal Coffee - A2UI Local Tester</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f8fafc; }
        .container { max-width: 900px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 20px; }
        .title { font-size: 1.3rem; font-weight: 700; color: #f59e0b; display: flex; align-items: center; gap: 8px; }
        .chat-box { border: 1px solid #334155; padding: 16px; min-height: 250px; height: auto; overflow: visible; margin-bottom: 16px; background: #0f172a; border-radius: 8px; }
        .msg { margin-bottom: 16px; line-height: 1.5; }
        .msg-user { color: #38bdf8; font-weight: 600; }
        .msg-agent { color: #f8fafc; }
        .msg-system { color: #94a3b8; font-style: italic; font-size: 0.85rem; }
        
        /* A2UI Component Styles */
        .a2ui-card { border: 1px solid #334155; border-left: 4px solid #f59e0b; padding: 18px; margin: 12px 0; border-radius: 8px; background: #1e293b; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2); }
        .a2ui-column { display: flex; flex-direction: column; gap: 10px; }
        .a2ui-row { display: flex; flex-direction: row; gap: 10px; align-items: center; }
        .a2ui-h1 { font-size: 1.4rem; font-weight: 700; color: #f8fafc; margin: 0 0 4px 0; }
        .a2ui-h2 { font-size: 1.2rem; font-weight: 600; color: #f8fafc; margin: 0 0 4px 0; }
        .a2ui-h3 { font-size: 1.05rem; font-weight: 600; color: #cbd5e1; margin: 0 0 2px 0; }
        .a2ui-body { font-size: 0.95rem; color: #e2e8f0; margin: 0; }
        .a2ui-button { background: #3b82f6; color: white; padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; }
        .a2ui-button:hover { background: #2563eb; transform: translateY(-1px); }
        .a2ui-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; }
        .badge-optimal { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
        .badge-warning { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
        .badge-critical { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        
        .a2ui-divider { border: none; border-top: 1px solid #334155; margin: 4px 0; }
        .a2ui-divider-vertical { border: none; border-left: 1px solid #334155; height: 100%; margin: 0 8px; align-self: stretch; }
        .a2ui-textfield { width: 100%; }
        .a2ui-textfield label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
        .a2ui-textfield input, .a2ui-textfield textarea { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #f8fafc; font-size: 0.9rem; }
        .a2ui-textfield input:focus, .a2ui-textfield textarea:focus { outline: none; border-color: #f59e0b; }
        .a2ui-select { width: 100%; }
        .a2ui-select label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
        .a2ui-select select { width: 100%; padding: 10px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #f8fafc; font-size: 0.9rem; appearance: auto; }
        .a2ui-checkbox { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #e2e8f0; }
        .a2ui-checkbox input { width: 18px; height: 18px; accent-color: #f59e0b; }
        .a2ui-slider { width: 100%; }
        .a2ui-slider label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
        .a2ui-slider input { width: 100%; accent-color: #f59e0b; }
        .a2ui-slider .slider-value { color: #f59e0b; font-weight: 600; font-size: 0.9rem; }
        .a2ui-image { max-width: 100%; border-radius: 6px; }
        .a2ui-image.icon { width: 24px; height: 24px; }
        .a2ui-image.avatar { width: 48px; height: 48px; border-radius: 50%; }
        .a2ui-image.smallFeature { max-width: 80px; }
        .a2ui-image.mediumFeature { max-width: 200px; }
        .a2ui-iframe { width: 100%; border: 1px solid #334155; border-radius: 6px; }
        .a2ui-tabs-header { display: flex; gap: 0; border-bottom: 2px solid #334155; margin-bottom: 12px; }
        .a2ui-tab-btn { padding: 8px 16px; background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.9rem; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .a2ui-tab-btn.active { color: #f59e0b; border-bottom-color: #f59e0b; }
        .a2ui-icon { font-family: 'Material Icons'; font-size: 20px; color: #94a3b8; }
        .a2ui-caption { font-size: 0.82rem; color: #94a3b8; margin: 0; }
        .a2ui-h4 { font-size: 0.95rem; font-weight: 600; color: #cbd5e1; margin: 0; }        
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex-grow: 1; padding: 12px; border: 1px solid #334155; border-radius: 6px; background: #0f172a; color: #f8fafc; font-size: 0.95rem; }
        input[type="text"]:focus { outline: none; border-color: #f59e0b; }
        pre { background: #020617; padding: 12px; border-radius: 6px; border: 1px solid #334155; overflow-x: auto; color: #38bdf8; font-size: 0.82rem; }
        details { margin-top: 15px; }
        summary { cursor: pointer; color: #f59e0b; font-weight: 600; font-size: 0.9rem; }
        .session-info { font-size: 0.85rem; color: #94a3b8; }
        .backend-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-left: 12px; transition: all 0.3s; }
        .status-online { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
        .status-offline { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.5); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">
                <span>☕ Cymbal Coffee - A2UI Local Tester</span>
                <span id="backend-status" class="backend-status status-offline">🔴 Checking Backend...</span>
            </div>
            <div class="session-info">
                <span id="session-id-display"></span>
                <button onclick="startNewSession()" class="a2ui-button" style="background: #ef4444; padding: 6px 12px; margin-left: 10px;">Reset</button>
            </div>
        </div>
        
        <div class="chat-box" id="chat">
            <div class="msg msg-system">A2UI Local Test Harness Active. Ready for queries.</div>
        </div>
        
        <div class="input-group">
            <input type="text" id="input" placeholder="Type prompt (e.g. 'Check inventory telemetry for all stores')...">
            <button onclick="sendMessage()" class="a2ui-button">Send</button>
        </div>
        
        <details open style="margin-top: 15px;">
            <summary style="color: #38bdf8; font-weight: 600;">Live Diagnostics Console</summary>
            <pre id="diag-log" style="height: 140px; overflow-y: auto; background: #020617; color: #4ade80; font-family: monospace; font-size: 0.8rem; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #334155;"></pre>
        </details>
        
        <details style="margin-top: 10px;">
            <summary>Show Raw A2UI JSON Payload</summary>
            <pre id="json-dump">No A2UI payload received yet.</pre>
        </details>
    </div>

    <script>
        let dataModel = {};
        let sessionId = 'session_' + Math.random().toString(36).substr(2, 9);

        function updateSessionDisplay() {
            document.getElementById('session-id-display').innerText = `Session ID: ${sessionId}`;
        }

        function startNewSession() {
            sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
            updateSessionDisplay();
            dataModel = {};
            document.getElementById('chat').innerHTML = '<div class="msg msg-system">Session reset.</div>';
            document.getElementById('json-dump').innerText = 'No A2UI payload received yet.';
        }

        let isBackendOnline = false;
        async function checkBackendHealth() {
            const statusEl = document.getElementById('backend-status');
            try {
                const res = await fetch('/health', { cache: 'no-store' });
                if (res.ok) {
                    const data = await res.json();
                    if (!isBackendOnline) {
                        logDiag(`[HEALTH] Backend online: ${data.agent || 'ok'}`);
                    }
                    isBackendOnline = true;
                    statusEl.className = 'backend-status status-online';
                    statusEl.innerHTML = '🟢 Backend Online (port 8001)';
                } else {
                    throw new Error(`HTTP ${res.status}`);
                }
            } catch (err) {
                if (isBackendOnline || statusEl.innerText.includes('Checking') || statusEl.innerText.includes('Online')) {
                    logDiag(`[ERROR] Backend unreachable: ${err.message}`);
                }
                isBackendOnline = false;
                statusEl.className = 'backend-status status-offline';
                statusEl.innerHTML = '🔴 Backend Offline — Run "uv run python local_tester/server.py"';
            }
        }
        checkBackendHealth();
        setInterval(checkBackendHealth, 3000);

        updateSessionDisplay();

        document.getElementById('input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const input = document.getElementById('input');
            const text = input.value;
            if (!text.trim()) return;
            input.value = '';
            
            appendMsg('User', text);
            await sendPayload({ message: { text: text } });
        }

        async function sendUserAction(userAction, messageText) {
            appendMsg('User', messageText || "Triggered UI Action");
            
            const payload = {
                message: {
                    text: messageText || "Triggered UI Action",
                    parts: [
                        {
                            data: { userAction: userAction },
                            metadata: { mimeType: 'application/json+a2ui' }
                        }
                    ]
                }
            };
            await sendPayload(payload);
        }

        async function sendPayload(params) {
            const loadingDiv = appendMsg('System', 'Agent processing request...');
            try {
                const response = await fetch('/jsonrpc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'message/send',
                        params: { ...params, session_id: sessionId },
                        id: Date.now()
                    })
                });
                
                const data = await response.json();
                loadingDiv.remove();
                handleResponse(data);
            } catch (error) {
                loadingDiv.remove();
                logDiag(`[ERROR] sendPayload failed: ${error.message}`);
                const errDiv = document.createElement('div');
                errDiv.className = 'a2ui-card';
                errDiv.style.borderLeftColor = '#ef4444';
                errDiv.style.background = 'rgba(239, 68, 68, 0.1)';
                errDiv.innerHTML = `<h4 style="color: #f87171; margin: 0 0 6px 0; font-size: 1rem;">⚠️ Backend Connection Warning</h4>
                                    <p style="color: #cbd5e1; font-size: 0.9rem; margin: 0;">Could not connect to A2A backend server on <strong>http://localhost:8001/jsonrpc</strong>.</p>
                                    <p style="color: #94a3b8; font-size: 0.82rem; margin: 6px 0 0 0;">Please verify the backend server is running by executing: <code style="background:#0f172a; padding:2px 6px; border-radius:4px; color:#4ade80;">uv run python local_tester/server.py</code></p>`;
                document.getElementById('chat').appendChild(errDiv);
            }
        }

        function appendMsg(sender, text) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = 'msg';
            if (sender === 'User') {
                div.innerHTML = `<span class="msg-user">User:</span> ${escapeHtml(text)}`;
            } else if (sender === 'Agent') {
                div.innerHTML = `<span style="color: #f59e0b; font-weight: 600;">Agent:</span> ${escapeHtml(text)}`;
            } else {
                div.innerHTML = `<span class="msg-system">${escapeHtml(text)}</span>`;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }

        function logDiag(msg, level = 'info') {
            const time = new Date().toLocaleTimeString();
            const logLine = `[${time}] [${level.toUpperCase()}] ${msg}`;
            console[level === 'error' ? 'error' : (level === 'warn' ? 'warn' : 'log')](logLine);
            const diagBox = document.getElementById('diag-log');
            if (diagBox) {
                diagBox.innerText += logLine + '\n';
                diagBox.scrollTop = diagBox.scrollHeight;
            }
        }

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            logDiag(`Uncaught Exception: ${msg} at line ${lineNo}:${columnNo}`, 'error');
            return false;
        };

        function handleResponse(data) {
            logDiag(`Received JSON-RPC response ID: ${data.id}`);
            if (data.error) {
                logDiag(`JSON-RPC Error: ${data.error.message}`, 'error');
                appendMsg('Error', data.error.message);
                return;
            }
            
            const parts = data.result && data.result.message && data.result.message.parts ? data.result.message.parts : [];
            logDiag(`Parts count in response: ${parts.length}`);
            
            for (let i = 0; i < parts.length; i++) {
                const part = parts[i];
                if (part.text) {
                    logDiag(`Part ${i}: Text (${part.text.length} chars)`);
                    appendMsg('Agent', part.text);
                }
                if (part.data && part.metadata && part.metadata.mimeType === 'application/json+a2ui') {
                    logDiag(`Part ${i}: A2UI DataPart detected!`);
                    const uiData = part.data;
                    document.getElementById('json-dump').innerText = JSON.stringify(uiData, null, 2);
                    renderA2UIMessage(uiData);
                }
            }
        }

        function renderA2UIMessage(uiData) {
            const chat = document.getElementById('chat');
            logDiag(`Starting renderA2UIMessage...`);
            
            // Normalize input into a messages array
            let messages;
            if (Array.isArray(uiData)) {
                messages = uiData;
            } else if (uiData.a2ui_messages) {
                messages = uiData.a2ui_messages;
            } else {
                messages = [uiData];
            }

            logDiag(`Messages count: ${messages.length}`);

            // Detect if messages is actually a flat component array
            const PROTOCOL_KEYS = ['beginRendering', 'surfaceUpdate', 'createSurface', 
                                   'updateComponents', 'dataModelUpdate', 'updateDataModel'];
            const isProtocol = messages.some(m => PROTOCOL_KEYS.some(k => k in m));
            const isComponentArray = !isProtocol && messages.length > 0 && 
                messages.every(m => m.id && (m.type || m.component || m.card || m.text || 
                    m.column || m.row || m.button || m.divider || m.Card || m.Text || 
                    m.Column || m.Row || m.Button || m.Divider || m.children || m.child));

            logDiag(`isProtocol: ${isProtocol}, isComponentArray: ${isComponentArray}`);

            let currentRoot = null;
            let components = [];

            // Check for wrapper object containing components array: { root: "...", components: [...] }
            if (messages.length === 1 && Array.isArray(messages[0].components)) {
                components = messages[0].components;
                currentRoot = messages[0].root || null;
                logDiag(`Extracted components from single wrapper object (count: ${components.length}, root: ${currentRoot})`);
            } else if (isComponentArray) {
                components = messages;
                logDiag(`Using flat component array (count: ${components.length})`);
            } else {
                for (const msg of messages) {
                    if (msg.dataModelUpdate && msg.dataModelUpdate.contents) {
                        for (const item of msg.dataModelUpdate.contents) {
                            dataModel[item.key] = item.valueString || item.valueNumber || item.valueBoolean;
                        }
                    }
                    if (msg.updateDataModel && msg.updateDataModel.value) {
                        const flattenObj = (obj, prefix) => {
                            for (const [k, v] of Object.entries(obj)) {
                                const path = prefix ? `${prefix}/${k}` : k;
                                if (typeof v === 'object' && v !== null && !Array.isArray(v)) {
                                    flattenObj(v, path);
                                } else {
                                    dataModel[path] = v;
                                }
                            }
                        };
                        flattenObj(msg.updateDataModel.value, '');
                    }
                    if (msg.beginRendering && msg.beginRendering.root) currentRoot = msg.beginRendering.root;
                    if (msg.surfaceUpdate && msg.surfaceUpdate.components) {
                        components = msg.surfaceUpdate.components;
                        if (msg.surfaceUpdate.root) currentRoot = msg.surfaceUpdate.root;
                    }
                    if (msg.updateComponents && msg.updateComponents.components) {
                        components = msg.updateComponents.components;
                    }
                    if (msg.components && !msg.surfaceUpdate && !msg.updateComponents) {
                        components = msg.components;
                        if (msg.root) currentRoot = msg.root;
                    }
                }
            }

            logDiag(`Final components array length: ${components.length}`);
            
            if (components.length > 0) {
                // Find root component: check root property or fallback to first component
                let rootComp = components.find(c => c.root === true || c.root === 'true');
                let rootId = currentRoot || (rootComp ? rootComp.id : components[0].id);
                logDiag(`Root ID determined: ${rootId}`);
                
                try {
                    const renderedNode = buildComponentNode(rootId, components);
                    if (renderedNode) {
                        logDiag(`Successfully built DOM node for root '${rootId}'! Appending to chat...`);
                        chat.appendChild(renderedNode);
                        chat.scrollTop = chat.scrollHeight;
                    } else {
                        logDiag(`buildComponentNode returned NULL for root '${rootId}'!`, 'error');
                    }
                } catch(err) {
                    logDiag(`Error building component tree: ${err.message}\n${err.stack}`, 'error');
                }
            } else {
                logDiag(`No components found to render!`, 'warn');
            }
        }

        // Helper: normalize a component entry to get its type and props
        // Format 1 (v0.8): { id: "x", component: { Card: { child: "y" } } }
        // Format 2 (v0.9): { id: "x", type: "Card", child: "y" }
        // Format 3 (key-based): { id: "x", card: { child: "y" } } or { id: "x", Card: { child: "y" } }
        const KNOWN_TYPES = ['Card','Column','Row','Text','Button','Divider','Image','Icon',
            'TextField','MultipleChoice','ChoicePicker','CheckBox','Slider','DateTimeInput',
            'WebFrameSrcdoc','WebFrameUrl','Tabs','Modal','AudioPlayer','Video','List','Chart','GoogleMap','Canvas'];
        const KNOWN_TYPES_LOWER = KNOWN_TYPES.map(t => t.toLowerCase());

        function normalizeComponent(entry) {
            if (!entry) return null;
            // Format 1a: component is a string property, e.g. { id: "x", component: "Card", child: "y" }
            if (typeof entry.component === 'string') {
                const { id, component, ...props } = entry;
                const idx = KNOWN_TYPES_LOWER.indexOf(component.toLowerCase());
                const type = idx !== -1 ? KNOWN_TYPES[idx] : component;
                return { type, props };
            }
            // Format 1b: v0.8 nested component wrapper, e.g. { id: "x", component: { Card: { child: "y" } } }
            if (typeof entry.component === 'object' && entry.component !== null) {
                const typeKey = Object.keys(entry.component)[0];
                return { type: typeKey, props: entry.component[typeKey] || {} };
            }
            // Format 2: v0.9 flat with explicit 'type' field
            if (entry.type) {
                const { id, type, ...props } = entry;
                const idx = KNOWN_TYPES_LOWER.indexOf(type.toLowerCase());
                const canonicalType = idx !== -1 ? KNOWN_TYPES[idx] : type;
                return { type: canonicalType, props };
            }
            // Format 3: component type as a key on the entry (lowercase or PascalCase)
            for (const key of Object.keys(entry)) {
                if (key === 'id' || key === 'root') continue;
                const idx = KNOWN_TYPES_LOWER.indexOf(key.toLowerCase());
                if (idx !== -1) {
                    const canonicalType = KNOWN_TYPES[idx]; // Always PascalCase
                    const val = entry[key];
                    const props = (typeof val === 'object' && val !== null) ? val : {};
                    return { type: canonicalType, props };
                }
            }
            return null;
        }

        // Helper: get children list from either format
        function getChildrenList(props) {
            if (!props) return [];
            // v0.8: { children: { explicitList: [...] } }
            if (props.children && props.children.explicitList) return props.children.explicitList;
            // v0.9: { children: [...] } (plain array)
            if (Array.isArray(props.children)) return props.children;
            return [];
        }

        // Helper: extract text string from any variation (literalString, path, string literal, text object)
        function getTextString(prop) {
            if (prop === undefined || prop === null) return "";
            if (typeof prop === 'string') return prop;
            if (typeof prop === 'number') return String(prop);
            if (typeof prop === 'object') {
                if (prop.literalString !== undefined) return prop.literalString;
                if (typeof prop.text === 'string') return prop.text;
                if (typeof prop.text === 'object') return getTextString(prop.text);
                if (prop.path) return dataModel[prop.path] || "";
            }
            return "";
        }

        function renderClientSvgBar(items) {
            if (!items || items.length === 0) {
                items = [
                    { label: 'Organic Dark Roast', value: 82, color: '#38bdf8' },
                    { label: 'Signature Espresso', value: 65, color: '#f59e0b' },
                    { label: 'Barista Oat Milk', value: 45, color: '#10b981' }
                ];
            }
            const colors = ['#38bdf8', '#f59e0b', '#10b981', '#a855f7', '#ec4899'];
            let bars = '';
            let y = 10;
            items.forEach((item, idx) => {
                const val = typeof item.value === 'number' ? item.value : (parseInt(item.value) || 50);
                const name = item.label || item.name || `Item ${idx+1}`;
                const color = item.color || colors[idx % colors.length];
                const barW = Math.round((val / 100) * 190);
                bars += `<text x="5" y="${y+15}" fill="#cbd5e1" font-size="11" font-weight="500">${name.substring(0, 16)}</text>
                         <rect x="110" y="${y}" width="190" height="22" rx="4" fill="#1e293b"/>
                         <rect x="110" y="${y}" width="${barW}" height="22" rx="4" fill="${color}"/>
                         <text x="${115+barW}" y="${y+15}" fill="#f8fafc" font-size="11" font-weight="700">${val}%</text>`;
                y += 34;
            });
            return `<svg width="100%" height="${y+10}" viewBox="0 0 340 ${y+10}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
        }

        function renderClientSvgPie(items, isDonut) {
            if (!items || items.length === 0) {
                items = [
                    { label: 'Organic Dark Roast', value: 82, color: '#38bdf8' },
                    { label: 'Signature Espresso', value: 65, color: '#f59e0b' },
                    { label: 'Barista Oat Milk', value: 45, color: '#10b981' }
                ];
            }
            const colors = ['#38bdf8', '#f59e0b', '#10b981', '#a855f7', '#ec4899'];
            const r = 45;
            const circ = 2 * Math.PI * r;
            const total = items.reduce((acc, i) => acc + (typeof i.value === 'number' ? i.value : (parseInt(i.value) || 0)), 0) || 1;
            const strokeW = isDonut ? 24 : 46;
            
            let offset = 0;
            let circles = '';
            let legend = '';
            
            items.forEach((item, idx) => {
                const val = typeof item.value === 'number' ? item.value : (parseInt(item.value) || 0);
                const color = item.color || colors[idx % colors.length];
                const name = item.label || item.name || `Item ${idx+1}`;
                const dash = (val / total) * circ;
                const gap = circ - dash;
                
                circles += `<circle cx="75" cy="75" r="${r}" fill="transparent" stroke="${color}" stroke-width="${strokeW}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"/>`;
                legend += `<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#cbd5e1;">
                             <div style="width:10px;height:10px;border-radius:2px;background:${color};"></div>
                             <span>${name}: ${val}%</span>
                           </div>`;
                offset += dash;
            });
            
            return `<div style="display:flex;align-items:center;gap:20px;padding:8px 0;">
                      <svg width="150" height="150" viewBox="0 0 150 150" style="transform:rotate(-90deg);" xmlns="http://www.w3.org/2000/svg">
                        ${circles}
                      </svg>
                      <div style="display:flex;flex-direction:column;gap:8px;">
                        ${legend}
                      </div>
                    </div>`;
        }

        function buildComponentNode(id, components) {
            const wrapper = components.find(c => c.id === id);
            if (!wrapper) return null;
            
            const normalized = normalizeComponent(wrapper);
            if (!normalized) return null;
            
            const { type, props } = normalized;
            // Build a synthetic comp object that all handlers can use
            const comp = {};
            comp[type] = props;
            
            if (comp.Card) {
                const card = document.createElement('div');
                card.className = 'a2ui-card';
                if (comp.Card.title) {
                    const titleEl = document.createElement('h3');
                    titleEl.className = 'a2ui-h3';
                    titleEl.style.color = '#f59e0b';
                    titleEl.style.marginBottom = '8px';
                    titleEl.innerText = comp.Card.title;
                    card.appendChild(titleEl);
                    const hr = document.createElement('hr');
                    hr.className = 'a2ui-divider';
                    card.appendChild(hr);
                }
                if (comp.Card.child) {
                    const childNode = buildComponentNode(comp.Card.child, components);
                    if (childNode) card.appendChild(childNode);
                }
                return card;
            }
            
            if (comp.Column) {
                const col = document.createElement('div');
                col.className = 'a2ui-column';
                const children = getChildrenList(comp.Column);
                for (const childId of children) {
                    const childNode = buildComponentNode(childId, components);
                    if (childNode) col.appendChild(childNode);
                }
                return col;
            }
            
            if (comp.Row) {
                const row = document.createElement('div');
                row.className = 'a2ui-row';
                if (comp.Row.mainAxisAlignment === 'spaceBetween' || comp.Row.distribution === 'spaceBetween') {
                    row.style.justifyContent = 'space-between';
                } else if (comp.Row.mainAxisAlignment === 'spaceAround' || comp.Row.distribution === 'spaceAround') {
                    row.style.justifyContent = 'space-around';
                }
                const children = getChildrenList(comp.Row);
                for (const childId of children) {
                    const childNode = buildComponentNode(childId, components);
                    if (childNode) row.appendChild(childNode);
                }
                return row;
            }
            
            if (comp.Text) {
                const textObj = comp.Text;
                const hint = textObj.usageHint || textObj.useageHint || textObj.variant || 'body';
                const str = getTextString(textObj.text !== undefined ? textObj.text : textObj);
                
                let tag = 'p';
                if (hint === 'h1') tag = 'h1';
                else if (hint === 'h2') tag = 'h2';
                else if (hint === 'h3') tag = 'h3';
                else if (hint === 'h4') tag = 'h4';
                else if (hint === 'caption') tag = 'span';
                
                const el = document.createElement(tag);
                el.className = `a2ui-${hint}`;
                
                // Enhance status text with glowing badges!
                let html = escapeHtml(str);
                html = html.replace(/\b(OPTIMAL)\b/g, '<span class="a2ui-badge badge-optimal">OPTIMAL</span>');
                html = html.replace(/\b(WARNING)\b/g, '<span class="a2ui-badge badge-warning">WARNING</span>');
                html = html.replace(/\b(CRITICAL|URGENT|STOCKOUT|IMMINENT)\b/g, '<span class="a2ui-badge badge-critical">$1</span>');
                el.innerHTML = html;
                return el;
            }
            
            if (comp.Button) {
                const btnObj = comp.Button;
                const btn = document.createElement('button');
                btn.className = 'a2ui-button';
                
                let btnLabel = "";
                if (btnObj.label) {
                    btnLabel = getTextString(btnObj.label);
                } else if (btnObj.child) {
                    const labelComp = components.find(c => c.id === btnObj.child);
                    if (labelComp) {
                        const normLabel = normalizeComponent(labelComp);
                        if (normLabel && normLabel.props) {
                            btnLabel = getTextString(normLabel.props.text !== undefined ? normLabel.props.text : normLabel.props);
                        }
                    }
                    if (!btnLabel) btnLabel = btnObj.child;
                } else if (btnObj.text) {
                    btnLabel = getTextString(btnObj.text);
                }
                btn.innerText = btnLabel || "Action";
                
                if (btnObj.action) {
                    btn.onclick = () => {
                        const actionObj = btnObj.action.event || btnObj.action;
                        const userAction = {
                            name: actionObj.name || actionObj.event || "submit",
                            context: {}
                        };
                        if (actionObj.context) {
                            if (Array.isArray(actionObj.context)) {
                                for (const item of actionObj.context) {
                                    if (item.key && item.value) {
                                        userAction.context[item.key] = getTextString(item.value);
                                    }
                                }
                            } else if (typeof actionObj.context === 'object') {
                                for (const [k, v] of Object.entries(actionObj.context)) {
                                    userAction.context[k] = getTextString(v);
                                }
                            }
                        }
                        const msgStr = userAction.context.message || btnLabel || "ButtonClicked";
                        sendUserAction(userAction, msgStr);
                    };
                }
                return btn;
            }
            
            if (comp.Divider) {
                const div = document.createElement('hr');
                div.className = comp.Divider.axis === 'vertical' ? 'a2ui-divider-vertical' : 'a2ui-divider';
                return div;
            }
            
            if (comp.TextField) {
                const tfObj = comp.TextField;
                const wrapper = document.createElement('div');
                wrapper.className = 'a2ui-textfield';
                
                const label = document.createElement('label');
                label.innerText = tfObj.label && tfObj.label.literalString ? tfObj.label.literalString : '';
                wrapper.appendChild(label);
                
                const variant = tfObj.variant || 'shortText';
                const input = document.createElement(variant === 'longText' ? 'textarea' : 'input');
                if (variant !== 'longText') {
                    if (variant === 'number') input.type = 'number';
                    else if (variant === 'obscured') input.type = 'password';
                    else input.type = 'text';
                }
                
                if (tfObj.text && tfObj.text.path) {
                    input.value = dataModel[tfObj.text.path] || '';
                    input.onchange = (e) => dataModel[tfObj.text.path] = e.target.value;
                } else if (tfObj.text && tfObj.text.literalString) {
                    input.value = tfObj.text.literalString;
                }
                wrapper.appendChild(input);
                
                return wrapper;
            }
            
            if (comp.MultipleChoice || comp.ChoicePicker) {
                const mcObj = comp.MultipleChoice || comp.ChoicePicker;
                const wrapper = document.createElement('div');
                wrapper.className = 'a2ui-select';
                
                if (mcObj.label && mcObj.label.literalString) {
                    const label = document.createElement('label');
                    label.innerText = mcObj.label.literalString;
                    wrapper.appendChild(label);
                }
                
                const select = document.createElement('select');
                if (mcObj.options) {
                    for (const opt of mcObj.options) {
                        const optionEl = document.createElement('option');
                        optionEl.value = opt.value;
                        optionEl.innerText = opt.label && opt.label.literalString ? opt.label.literalString : opt.value;
                        select.appendChild(optionEl);
                    }
                }
                
                const path = (mcObj.selections && mcObj.selections.path) || (mcObj.value && mcObj.value.path);
                if (path) {
                    select.value = dataModel[path] || '';
                    select.onchange = (e) => dataModel[path] = e.target.value;
                }
                
                wrapper.appendChild(select);
                return wrapper;
            }
            
            if (comp.CheckBox) {
                const cbObj = comp.CheckBox;
                const label = document.createElement('label');
                label.className = 'a2ui-checkbox';
                
                const input = document.createElement('input');
                input.type = 'checkbox';
                if (cbObj.value && cbObj.value.path) {
                    input.checked = !!dataModel[cbObj.value.path];
                    input.onchange = (e) => dataModel[cbObj.value.path] = e.target.checked;
                }
                label.appendChild(input);
                
                const span = document.createElement('span');
                span.innerText = cbObj.label && cbObj.label.literalString ? cbObj.label.literalString : '';
                label.appendChild(span);
                
                return label;
            }
            
            if (comp.Slider) {
                const sliderObj = comp.Slider;
                const wrapper = document.createElement('div');
                wrapper.className = 'a2ui-slider';
                
                if (sliderObj.label && sliderObj.label.literalString) {
                    const label = document.createElement('label');
                    label.innerText = sliderObj.label.literalString;
                    wrapper.appendChild(label);
                }
                
                const input = document.createElement('input');
                input.type = 'range';
                input.min = sliderObj.minValue !== undefined ? sliderObj.minValue : (sliderObj.min !== undefined ? sliderObj.min : 0);
                input.max = sliderObj.maxValue !== undefined ? sliderObj.maxValue : (sliderObj.max !== undefined ? sliderObj.max : 100);
                
                const valSpan = document.createElement('span');
                valSpan.className = 'slider-value';
                
                if (sliderObj.value && sliderObj.value.path) {
                    input.value = dataModel[sliderObj.value.path] || input.min;
                    valSpan.innerText = input.value;
                    input.oninput = (e) => {
                        dataModel[sliderObj.value.path] = e.target.value;
                        valSpan.innerText = e.target.value;
                    };
                }
                
                wrapper.appendChild(input);
                wrapper.appendChild(valSpan);
                return wrapper;
            }
            
            if (comp.Image) {
                const imgObj = comp.Image;
                const img = document.createElement('img');
                img.className = 'a2ui-image';
                if (imgObj.usageHint) {
                    img.classList.add(imgObj.usageHint);
                }
                if (imgObj.url && imgObj.url.literalString) {
                    img.src = imgObj.url.literalString;
                } else if (imgObj.url && imgObj.url.path) {
                    img.src = dataModel[imgObj.url.path] || '';
                }
                return img;
            }
            
            if (comp.WebFrameSrcdoc) {
                const wfObj = comp.WebFrameSrcdoc;
                const props = wfObj.props || wfObj;
                const iframe = document.createElement('iframe');
                iframe.className = 'a2ui-iframe';
                
                let rawSrcdoc = "";
                if (props.srcdoc) {
                    rawSrcdoc = typeof props.srcdoc === 'object' ? (props.srcdoc.literalString || props.srcdoc.text || "") : props.srcdoc;
                } else if (props.srcDoc) {
                    rawSrcdoc = typeof props.srcDoc === 'object' ? (props.srcDoc.literalString || props.srcDoc.text || "") : props.srcDoc;
                }
                
                logDiag(`WebFrameSrcdoc srcdoc length: ${rawSrcdoc.length}`);
                iframe.srcdoc = rawSrcdoc;
                iframe.sandbox = "allow-scripts allow-same-origin";
                iframe.style.width = "100%";
                iframe.style.border = "1px solid #334155";
                iframe.style.borderRadius = "6px";
                iframe.style.background = "#0f172a";
                iframe.style.height = (typeof props.height === 'number' ? props.height : (parseInt(props.height) || 240)) + 'px';
                return iframe;
            }
            
            if (comp.WebFrameUrl) {
                const wfObj = comp.WebFrameUrl;
                const iframe = document.createElement('iframe');
                iframe.className = 'a2ui-iframe';
                if (wfObj.url && wfObj.url.literalString) {
                    iframe.src = wfObj.url.literalString;
                }
                iframe.sandbox = "allow-scripts allow-same-origin";
                iframe.style.height = typeof wfObj.height === 'number' ? wfObj.height + 'px' : (wfObj.height || '200px');
                return iframe;
            }
            
            if (comp.Chart) {
                const chartObj = comp.Chart;
                const props = chartObj.props || chartObj;
                const chartType = (props.type || 'bar').toLowerCase();
                const titleStr = props.title ? getTextString(props.title) : 'Analytics Chart';
                
                let items = [];
                if (props.chartData) {
                    if (Array.isArray(props.chartData)) {
                        items = props.chartData;
                    } else if (props.chartData.literalArray && Array.isArray(props.chartData.literalArray)) {
                        items = props.chartData.literalArray;
                    } else if (props.chartData.path && dataModel[props.chartData.path]) {
                        items = dataModel[props.chartData.path];
                    }
                }
                
                const card = document.createElement('div');
                card.className = 'a2ui-card a2ui-chart-card';
                card.style.background = '#0f172a';
                card.style.border = '1px solid #334155';
                card.style.borderRadius = '10px';
                card.style.padding = '16px';
                card.style.margin = '12px 0';

                const titleEl = document.createElement('h3');
                titleEl.className = 'a2ui-h3';
                titleEl.style.color = '#f59e0b';
                titleEl.style.marginBottom = '12px';
                titleEl.innerText = titleStr;
                card.appendChild(titleEl);

                const chartSvgContainer = document.createElement('div');
                chartSvgContainer.className = 'a2ui-chart-svg';
                
                if (chartType === 'pie' || chartType === 'doughnut') {
                    const isDonut = chartType === 'doughnut';
                    chartSvgContainer.innerHTML = renderClientSvgPie(items, isDonut);
                } else {
                    chartSvgContainer.innerHTML = renderClientSvgBar(items);
                }
                
                card.appendChild(chartSvgContainer);
                return card;
            }
            
            if (comp.DateTimeInput) {
                const dtObj = comp.DateTimeInput;
                const wrapper = document.createElement('div');
                wrapper.className = 'a2ui-textfield';
                
                if (dtObj.label && dtObj.label.literalString) {
                    const label = document.createElement('label');
                    label.innerText = dtObj.label.literalString;
                    wrapper.appendChild(label);
                }
                
                const input = document.createElement('input');
                if (dtObj.enableDate && dtObj.enableTime) {
                    input.type = 'datetime-local';
                } else if (dtObj.enableTime) {
                    input.type = 'time';
                } else {
                    input.type = 'date';
                }
                
                if (dtObj.value && dtObj.value.path) {
                    input.value = dataModel[dtObj.value.path] || '';
                    input.onchange = (e) => dataModel[dtObj.value.path] = e.target.value;
                }
                
                wrapper.appendChild(input);
                return wrapper;
            }
            
            if (comp.Icon) {
                const iconObj = comp.Icon;
                const span = document.createElement('span');
                span.className = 'a2ui-icon';
                span.innerText = iconObj.name || iconObj.literalString || '';
                return span;
            }
            
            if (comp.Tabs) {
                const tabsObj = comp.Tabs;
                const wrapper = document.createElement('div');
                
                const header = document.createElement('div');
                header.className = 'a2ui-tabs-header';
                wrapper.appendChild(header);
                
                const contentArea = document.createElement('div');
                wrapper.appendChild(contentArea);
                
                const tabs = tabsObj.tabs || [];
                
                const renderTab = (idx) => {
                    contentArea.innerHTML = '';
                    const tabBtn = header.children;
                    for (let i = 0; i < tabBtn.length; i++) {
                        tabBtn[i].classList.toggle('active', i === idx);
                    }
                    if (tabs[idx] && tabs[idx].child) {
                        const childNode = buildComponentNode(tabs[idx].child, components);
                        if (childNode) contentArea.appendChild(childNode);
                    }
                };
                
                tabs.forEach((tab, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'a2ui-tab-btn';
                    btn.innerText = tab.title || `Tab ${idx + 1}`;
                    btn.onclick = () => renderTab(idx);
                    header.appendChild(btn);
                });
                
                if (tabs.length > 0) {
                    renderTab(0);
                }
                
                return wrapper;
            }
            
            return null;
        }
    </script>
</body>
</html>
