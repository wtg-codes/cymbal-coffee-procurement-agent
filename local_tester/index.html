<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2UI Local Tester — Cymbal Coffee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #1e2530;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #f59e0b;
      --accent-dim: rgba(245,158,11,.15);
      --red: #f85149;
      --green: #3fb950;
      --blue: #58a6ff;
      --radius: 10px;
      --font: 'Inter', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Header ─────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1rem; letter-spacing: -0.3px;
    }
    .logo .badge {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.5px;
      background: var(--accent-dim); color: var(--accent);
      padding: 2px 7px; border-radius: 999px; border: 1px solid var(--accent);
    }
    .session-bar {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.78rem; color: var(--text-muted);
    }
    #session-id { font-family: monospace; color: var(--blue); }
    .btn-sm {
      padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-size: 0.78rem;
      cursor: pointer; transition: border-color .2s, background .2s;
    }
    .btn-sm:hover { border-color: var(--accent); background: var(--accent-dim); }

    /* ─── Layout ─────────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 53px);
    }

    /* ─── Chat Panel ──────────────────────────────────────────── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
      border-right: 1px solid var(--border);
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .msg { display: flex; flex-direction: column; gap: 4px; max-width: 90%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.agent { align-self: flex-start; }
    .msg.system { align-self: center; }
    .bubble {
      padding: 10px 14px; border-radius: 12px;
      font-size: 0.88rem; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
    }
    .msg.user .bubble { background: var(--accent); color: #000; border-radius: 12px 12px 2px 12px; }
    .msg.agent .bubble { background: var(--surface2); border: 1px solid var(--border); border-radius: 2px 12px 12px 12px; }
    .msg.system .bubble { background: transparent; color: var(--text-muted); font-size: 0.78rem; font-style: italic; }
    .msg-label { font-size: 0.7rem; color: var(--text-muted); padding: 0 4px; }

    /* Typing indicator */
    .typing { display: flex; gap: 5px; padding: 12px 14px; }
    .typing span {
      width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce {
      0%,80%,100% { transform: scale(0.8); opacity: .5; }
      40% { transform: scale(1.1); opacity: 1; }
    }

    /* Input */
    .input-row {
      display: flex; gap: 8px; padding: 14px;
      border-top: 1px solid var(--border); background: var(--surface);
    }
    #input {
      flex: 1; padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-size: 0.9rem; font-family: var(--font);
      outline: none; transition: border-color .2s;
    }
    #input:focus { border-color: var(--accent); }
    #send-btn {
      padding: 10px 20px; border-radius: 8px; border: none;
      background: var(--accent); color: #000; font-weight: 600;
      font-size: 0.88rem; cursor: pointer; transition: opacity .2s;
    }
    #send-btn:hover { opacity: .85; }
    #send-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ─── UI Render Panel ─────────────────────────────────────── */
    .render-panel {
      width: 460px;
      min-width: 360px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .render-panel-header {
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.8px;
      text-transform: uppercase; color: var(--text-muted);
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
    }
    .render-empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; height: 200px; color: var(--text-muted);
      text-align: center; font-size: 0.85rem;
    }
    .render-empty .material-icons-round { font-size: 3rem; opacity: .3; }

    /* Debug / raw JSON toggle */
    .raw-toggle {
      font-size: 0.72rem; cursor: pointer; color: var(--text-muted);
      display: flex; align-items: center; gap: 4px;
      user-select: none; margin-top: 8px;
    }
    .raw-toggle:hover { color: var(--blue); }
    #raw-json { display: none; }
    #raw-json.visible { display: block; }
    pre#raw-json {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 10px; font-size: 0.72rem;
      overflow-x: auto; white-space: pre-wrap; word-break: break-all;
      max-height: 300px; overflow-y: auto;
    }

    /* ═══════════════════════════════════════════════════════════
       A2UI Component Renderers
    ═══════════════════════════════════════════════════════════ */

    /* Card */
    .a2ui-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
    }

    /* Column */
    .a2ui-column {
      display: flex; flex-direction: column; gap: 10px;
    }

    /* Row */
    .a2ui-row {
      display: flex; flex-direction: row; gap: 10px;
      align-items: center; flex-wrap: wrap;
    }
    .a2ui-row.spaceAround { justify-content: space-around; }
    .a2ui-row.spaceBetween { justify-content: space-between; }
    .a2ui-row.spaceEvenly { justify-content: space-evenly; }
    .a2ui-row.center { justify-content: center; }
    .a2ui-row.end { justify-content: flex-end; }

    /* Text */
    .a2ui-text { color: var(--text); line-height: 1.5; }
    .a2ui-text.h1 { font-size: 1.4rem; font-weight: 700; }
    .a2ui-text.h2 { font-size: 1.15rem; font-weight: 600; }
    .a2ui-text.h3 { font-size: 1rem; font-weight: 600; }
    .a2ui-text.h4 { font-size: 0.9rem; font-weight: 600; }
    .a2ui-text.h5 { font-size: 0.82rem; font-weight: 600; color: var(--text-muted); }
    .a2ui-text.caption { font-size: 0.75rem; color: var(--text-muted); }
    .a2ui-text.body { font-size: 0.88rem; }

    /* Button */
    .a2ui-btn {
      padding: 9px 16px; border-radius: 8px; border: 1px solid var(--accent);
      background: var(--accent-dim); color: var(--accent);
      font-size: 0.85rem; font-weight: 600; font-family: var(--font);
      cursor: pointer; transition: background .2s, transform .1s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .a2ui-btn:hover { background: var(--accent); color: #000; transform: translateY(-1px); }
    .a2ui-btn.primary {
      background: var(--accent); color: #000;
    }
    .a2ui-btn.primary:hover { opacity: .85; }

    /* Divider */
    .a2ui-divider {
      border: none; border-top: 1px solid var(--border);
      margin: 4px 0; width: 100%;
    }
    .a2ui-divider.vertical {
      border: none; border-left: 1px solid var(--border);
      height: 100%; margin: 0 4px; align-self: stretch;
    }

    /* TextField */
    .a2ui-field { display: flex; flex-direction: column; gap: 5px; width: 100%; }
    .a2ui-field label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
    .a2ui-field input, .a2ui-field textarea, .a2ui-field select {
      padding: 9px 12px; border-radius: 7px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-size: 0.88rem; font-family: var(--font);
      outline: none; transition: border-color .2s; width: 100%;
    }
    .a2ui-field input:focus, .a2ui-field textarea:focus, .a2ui-field select:focus {
      border-color: var(--accent);
    }

    /* MultipleChoice */
    .a2ui-mc { display: flex; flex-direction: column; gap: 5px; width: 100%; }
    .a2ui-mc label { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }

    /* CheckBox */
    .a2ui-checkbox {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; font-size: 0.88rem;
    }
    .a2ui-checkbox input { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }

    /* Slider */
    .a2ui-slider { display: flex; flex-direction: column; gap: 6px; width: 100%; }
    .a2ui-slider label { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); }
    .a2ui-slider label span { color: var(--accent); font-weight: 600; }
    .a2ui-slider input[type=range] { width: 100%; accent-color: var(--accent); }

    /* Image */
    .a2ui-image { max-width: 100%; border-radius: 8px; display: block; }
    .a2ui-image.icon { width: 24px; height: 24px; object-fit: contain; }
    .a2ui-image.avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
    .a2ui-image.smallFeature { max-width: 80px; }
    .a2ui-image.mediumFeature { max-width: 200px; }

    /* Icon */
    .a2ui-icon { font-size: 1.5rem; vertical-align: middle; color: var(--accent); }

    /* Iframe */
    .a2ui-iframe {
      width: 100%; border: 1px solid var(--border);
      border-radius: 8px; display: block;
    }

    /* Tabs */
    .a2ui-tabs { display: flex; flex-direction: column; gap: 0; }
    .a2ui-tab-bar { display: flex; border-bottom: 2px solid var(--border); }
    .a2ui-tab-btn {
      padding: 8px 16px; background: none; border: none;
      color: var(--text-muted); font-size: 0.85rem; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -2px;
      transition: color .2s, border-color .2s; font-family: var(--font);
    }
    .a2ui-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .a2ui-tab-content { padding-top: 12px; }

    /* Unknown fallback */
    .a2ui-unknown {
      border: 1px dashed #f59e0b44; padding: 8px 12px; border-radius: 6px;
      background: #f59e0b0a; font-size: 0.78rem; color: var(--text-muted);
    }

    /* Validation error banner */
    .validation-error {
      background: rgba(248,81,73,.1); border: 1px solid var(--red);
      border-radius: 8px; padding: 10px 14px; font-size: 0.82rem;
      color: var(--red); display: flex; align-items: flex-start; gap: 8px;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    ☕ A2UI Local Tester
    <span class="badge">v0.8</span>
  </div>
  <div class="session-bar">
    Session: <span id="session-id">—</span>
    <button class="btn-sm" id="new-session-btn">New Session</button>
  </div>
</header>

<div class="layout">

  <!-- Chat -->
  <div class="chat-panel">
    <div id="chat"></div>
    <div class="input-row">
      <input id="input" type="text"
        placeholder="Ask the agent anything… (Enter to send)"
        autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- A2UI Render Panel -->
  <div class="render-panel">
    <div class="render-panel-header">🎨 Rendered UI Surface</div>
    <div id="render-root">
      <div class="render-empty">
        <span class="material-icons-round">widgets</span>
        Send a message to render the A2UI card here.
      </div>
    </div>
    <div class="raw-toggle" onclick="toggleRaw()">
      <span class="material-icons-round" style="font-size:1rem">code</span>
      Toggle raw A2UI JSON
    </div>
    <pre id="raw-json">No A2UI data yet.</pre>
  </div>

</div>

<script>
'use strict';

// ──────────────────────────────────────────────────────────────
// State
// ──────────────────────────────────────────────────────────────
let sessionId = mkId();
let dataModel = {};
let components = {};  // id → component dict (flat map for fast lookup)
let busy = false;

document.getElementById('session-id').textContent = sessionId.slice(0, 12);
document.getElementById('new-session-btn').addEventListener('click', newSession);
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('send-btn').addEventListener('click', sendMessage);

function mkId() {
  return 'ses_' + Math.random().toString(36).slice(2, 11);
}

function newSession() {
  sessionId = mkId();
  dataModel = {};
  components = {};
  document.getElementById('session-id').textContent = sessionId.slice(0, 12);
  document.getElementById('chat').innerHTML = '';
  document.getElementById('render-root').innerHTML =
    '<div class="render-empty"><span class="material-icons-round">widgets</span>New session started.</div>';
  document.getElementById('raw-json').textContent = 'No A2UI data yet.';
  addChat('system', 'New session started.');
}

function toggleRaw() {
  document.getElementById('raw-json').classList.toggle('visible');
}

// ──────────────────────────────────────────────────────────────
// Chat UI helpers
// ──────────────────────────────────────────────────────────────
function addChat(role, text) {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;

  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : role === 'agent' ? 'Agent' : '';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;

  if (label.textContent) wrap.appendChild(label);
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function addTyping() {
  const chat = document.getElementById('chat');
  const wrap = document.createElement('div');
  wrap.className = 'msg agent';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  wrap.appendChild(bubble);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

// ──────────────────────────────────────────────────────────────
// Send message
// ──────────────────────────────────────────────────────────────
async function sendMessage() {
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  if (!text || busy) return;
  inp.value = '';
  addChat('user', text);
  await sendPayload({ message: { text } });
}

async function sendUserAction(userAction, msgText) {
  addChat('user', msgText || 'Action triggered');
  const payload = {
    message: {
      text: msgText || 'Action triggered',
      parts: [{
        data: { userAction },
        metadata: { mimeType: 'application/json+a2ui' }
      }]
    }
  };
  await sendPayload(payload);
}

async function sendPayload(params) {
  if (busy) return;
  busy = true;
  document.getElementById('send-btn').disabled = true;
  const typing = addTyping();

  try {
    const res = await fetch('/jsonrpc', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        method: 'message/send',
        params: { ...params, session_id: sessionId },
        id: Date.now()
      })
    });
    const data = await res.json();
    typing.remove();
    handleResponse(data);
  } catch (err) {
    typing.remove();
    addChat('system', `Connection error: ${err.message}`);
  } finally {
    busy = false;
    document.getElementById('send-btn').disabled = false;
  }
}

// ──────────────────────────────────────────────────────────────
// Response handler
// ──────────────────────────────────────────────────────────────
function handleResponse(data) {
  if (data.error) {
    addChat('system', `Error ${data.error.code}: ${data.error.message}`);
    return;
  }

  const parts = data.result?.message?.parts || [];
  let hasA2UI = false;

  // Collect all A2UI messages across parts for logging
  const allA2UI = [];

  for (const part of parts) {
    if (part.text) {
      addChat('agent', part.text);
    }

    const mime = part.metadata?.mimeType || '';
    if (part.data && (mime === 'application/json+a2ui' || mime === 'application/a2ui+json')) {
      processA2UIMessage(part.data);
      allA2UI.push(part.data);
      hasA2UI = true;
    }
  }

  if (allA2UI.length) {
    document.getElementById('raw-json').textContent = JSON.stringify(allA2UI, null, 2);
  }

  if (!hasA2UI && parts.length === 0) {
    addChat('agent', '(No response)');
  }
}

// ──────────────────────────────────────────────────────────────
// A2UI message dispatcher
// ──────────────────────────────────────────────────────────────
function processA2UIMessage(msg) {
  if (msg.beginRendering) {
    // Reset component map for fresh render
    components = {};
  }
  if (msg.dataModelUpdate) {
    handleDataModelUpdate(msg.dataModelUpdate);
  }
  if (msg.surfaceUpdate) {
    handleSurfaceUpdate(msg.surfaceUpdate);
  }
  if (msg.deleteSurface) {
    document.getElementById('render-root').innerHTML =
      '<div class="render-empty"><span class="material-icons-round">widgets</span>Surface cleared.</div>';
    components = {};
  }
}

function handleDataModelUpdate(update) {
  for (const item of update.contents || []) {
    const val = item.valueString ?? item.valueNumber ?? item.valueBoolean ?? item.valueMap ?? null;
    dataModel[item.key] = val;
    // Also store with/without leading slash for resilience
    const altKey = item.key.startsWith('/') ? item.key.slice(1) : '/' + item.key;
    dataModel[altKey] = val;
  }
}

function handleSurfaceUpdate(update) {
  // Build flat component map
  for (const entry of update.components || []) {
    components[entry.id] = entry.component;
  }

  // Find root: first component in list, or look for Card at top
  const compsArr = update.components || [];
  if (!compsArr.length) return;

  // Root is typically the first entry
  const rootId = compsArr[0].id;
  const rendered = renderComponent(rootId);

  const root = document.getElementById('render-root');
  root.innerHTML = '';
  if (rendered) root.appendChild(rendered);
}

// ──────────────────────────────────────────────────────────────
// A2UI Component Renderers
// ──────────────────────────────────────────────────────────────
function resolveValue(valObj) {
  if (!valObj) return '';
  if (valObj.literalString !== undefined) return valObj.literalString;
  if (valObj.literalNumber !== undefined) return String(valObj.literalNumber);
  if (valObj.literalBoolean !== undefined) return valObj.literalBoolean;
  if (valObj.path !== undefined) {
    const v = dataModel[valObj.path] ?? dataModel[valObj.path.replace(/^\//, '')];
    return v !== undefined ? String(v) : '';
  }
  return '';
}

function renderComponent(id) {
  const comp = components[id];
  if (!comp) {
    const el = document.createElement('div');
    el.className = 'a2ui-unknown';
    el.textContent = `[Missing component: ${id}]`;
    return el;
  }

  const type = Object.keys(comp)[0];
  const props = comp[type] || {};

  switch (type) {

    case 'Card': {
      const el = document.createElement('div');
      el.className = 'a2ui-card';
      if (props.child) el.appendChild(renderComponent(props.child));
      return el;
    }

    case 'Column': {
      const el = document.createElement('div');
      el.className = 'a2ui-column';
      if (props.alignment) el.style.alignItems =
        props.alignment === 'start' ? 'flex-start' :
        props.alignment === 'end' ? 'flex-end' : props.alignment;
      renderChildren(props.children, el);
      return el;
    }

    case 'Row': {
      const el = document.createElement('div');
      el.className = `a2ui-row ${props.distribution || ''}`;
      if (props.alignment) el.style.alignItems =
        props.alignment === 'start' ? 'flex-start' :
        props.alignment === 'end' ? 'flex-end' : props.alignment;
      renderChildren(props.children, el);
      return el;
    }

    case 'List': {
      const el = document.createElement('div');
      el.className = 'a2ui-column';
      if (props.direction === 'horizontal') {
        el.className = 'a2ui-row';
        el.style.flexWrap = 'wrap';
      }
      renderChildren(props.children, el);
      return el;
    }

    case 'Text': {
      const el = document.createElement('div');
      const hint = props.usageHint || 'body';
      el.className = `a2ui-text ${hint}`;
      el.textContent = resolveValue(props.text);
      return el;
    }

    case 'Icon': {
      const el = document.createElement('span');
      el.className = 'material-icons-round a2ui-icon';
      el.textContent = resolveValue(props.name);
      return el;
    }

    case 'Image': {
      const el = document.createElement('img');
      el.className = `a2ui-image ${props.usageHint || ''}`;
      el.src = resolveValue(props.url);
      el.alt = resolveValue(props.altText) || '';
      if (props.fit) el.style.objectFit = props.fit;
      return el;
    }

    case 'Divider': {
      const el = document.createElement('hr');
      el.className = `a2ui-divider ${props.axis === 'vertical' ? 'vertical' : ''}`;
      return el;
    }

    case 'Button': {
      const btn = document.createElement('button');
      btn.className = `a2ui-btn ${props.primary ? 'primary' : ''}`;

      // Render label child
      if (props.child) {
        const childComp = components[props.child];
        if (childComp?.Text) {
          btn.textContent = resolveValue(childComp.Text.text);
        } else if (childComp) {
          btn.appendChild(renderComponent(props.child));
        } else {
          btn.textContent = props.child;
        }
      }

      if (props.action) {
        btn.addEventListener('click', () => handleButtonClick(props.action));
      }
      return btn;
    }

    case 'TextField': {
      const wrap = document.createElement('div');
      wrap.className = 'a2ui-field';
      const lbl = document.createElement('label');
      lbl.textContent = resolveValue(props.label);

      const fieldType = props.textFieldType || 'shortText';
      let inp;
      if (fieldType === 'longText') {
        inp = document.createElement('textarea');
        inp.rows = 3;
      } else {
        inp = document.createElement('input');
        inp.type = fieldType === 'number' ? 'number' :
                   fieldType === 'obscured' ? 'password' : 'text';
      }
      inp.value = resolveValue(props.text);

      if (props.text?.path) {
        const p = props.text.path;
        inp.addEventListener('input', e => {
          dataModel[p] = e.target.value;
          dataModel[p.replace(/^\//, '')] = e.target.value;
        });
      }
      wrap.appendChild(lbl);
      wrap.appendChild(inp);
      return wrap;
    }

    case 'MultipleChoice': {
      const wrap = document.createElement('div');
      wrap.className = 'a2ui-mc';
      const sel = document.createElement('select');
      const emptyOpt = document.createElement('option');
      emptyOpt.value = ''; emptyOpt.textContent = 'Select…';
      sel.appendChild(emptyOpt);

      for (const opt of props.options || []) {
        const o = document.createElement('option');
        o.value = opt.value;
        o.textContent = resolveValue(opt.label);
        sel.appendChild(o);
      }

      const selPath = props.selections?.path;
      if (selPath) {
        sel.value = dataModel[selPath] || '';
        sel.addEventListener('change', e => {
          dataModel[selPath] = e.target.value;
          dataModel[selPath.replace(/^\//, '')] = e.target.value;
        });
      }
      wrap.appendChild(sel);
      return wrap;
    }

    case 'CheckBox': {
      const label = document.createElement('label');
      label.className = 'a2ui-checkbox';
      const inp = document.createElement('input');
      inp.type = 'checkbox';

      const valObj = props.value;
      if (valObj?.path) {
        const p = valObj.path;
        inp.checked = !!dataModel[p];
        inp.addEventListener('change', e => {
          dataModel[p] = e.target.checked;
          dataModel[p.replace(/^\//, '')] = e.target.checked;
        });
      } else if (valObj?.literalBoolean !== undefined) {
        inp.checked = valObj.literalBoolean;
      }

      const span = document.createElement('span');
      span.textContent = resolveValue(props.label);
      label.appendChild(inp);
      label.appendChild(span);
      return label;
    }

    case 'Slider': {
      const wrap = document.createElement('div');
      wrap.className = 'a2ui-slider';
      const lbl = document.createElement('label');
      const lbl_text = document.createElement('span');
      lbl_text.textContent = resolveValue(props.label) || 'Value';
      const val_span = document.createElement('span');
      const inp = document.createElement('input');
      inp.type = 'range';
      inp.min = props.minValue ?? 0;
      inp.max = props.maxValue ?? 100;

      const valPath = props.value?.path;
      const initVal = valPath
        ? (dataModel[valPath] ?? props.minValue ?? 0)
        : (props.value?.literalNumber ?? 0);
      inp.value = initVal;
      val_span.textContent = initVal;

      if (valPath) {
        inp.addEventListener('input', e => {
          val_span.textContent = e.target.value;
          dataModel[valPath] = Number(e.target.value);
          dataModel[valPath.replace(/^\//, '')] = Number(e.target.value);
        });
      }
      lbl.appendChild(lbl_text);
      lbl.appendChild(val_span);
      wrap.appendChild(lbl);
      wrap.appendChild(inp);
      return wrap;
    }

    case 'DateTimeInput': {
      const wrap = document.createElement('div');
      wrap.className = 'a2ui-field';
      const inp = document.createElement('input');
      if (props.enableDate === false && props.enableTime === true) inp.type = 'time';
      else if (props.enableDate === true && props.enableTime === false) inp.type = 'date';
      else inp.type = 'datetime-local';

      const valObj = props.value;
      if (valObj?.path) {
        const p = valObj.path;
        inp.value = dataModel[p] || '';
        inp.addEventListener('change', e => {
          dataModel[p] = e.target.value;
          dataModel[p.replace(/^\//, '')] = e.target.value;
        });
      } else if (valObj?.literalString) {
        inp.value = valObj.literalString;
      }
      wrap.appendChild(inp);
      return wrap;
    }

    case 'Tabs': {
      const wrap = document.createElement('div');
      wrap.className = 'a2ui-tabs';
      const bar = document.createElement('div');
      bar.className = 'a2ui-tab-bar';
      const content = document.createElement('div');
      content.className = 'a2ui-tab-content';

      (props.tabItems || []).forEach((tab, i) => {
        const btn = document.createElement('button');
        btn.className = 'a2ui-tab-btn' + (i === 0 ? ' active' : '');
        btn.textContent = resolveValue(tab.title);
        btn.addEventListener('click', () => {
          bar.querySelectorAll('.a2ui-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          content.innerHTML = '';
          if (tab.child) content.appendChild(renderComponent(tab.child));
        });
        bar.appendChild(btn);
      });

      wrap.appendChild(bar);
      if (props.tabItems?.[0]?.child) {
        content.appendChild(renderComponent(props.tabItems[0].child));
      }
      wrap.appendChild(content);
      return wrap;
    }

    case 'WebFrameSrcdoc': {
      const iframe = document.createElement('iframe');
      iframe.className = 'a2ui-iframe';
      iframe.srcdoc = resolveValue(props.srcdoc);
      iframe.style.height = (props.height || 300) + 'px';
      iframe.setAttribute('sandbox', 'allow-scripts');
      return iframe;
    }

    case 'WebFrameUrl': {
      const iframe = document.createElement('iframe');
      iframe.className = 'a2ui-iframe';
      iframe.src = resolveValue(props.url);
      iframe.style.height = (props.height || 300) + 'px';
      iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin');
      return iframe;
    }

    case 'Modal': {
      // Render entry point; clicking opens a simple overlay
      const btn = renderComponent(props.entryPointChild);
      if (props.contentChild && btn) {
        btn.addEventListener('click', () => {
          const overlay = document.createElement('div');
          overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;display:flex;align-items:center;justify-content:center';
          const box = document.createElement('div');
          box.style.cssText = 'background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;max-width:480px;width:90%;position:relative';
          const close = document.createElement('button');
          close.textContent = '✕';
          close.style.cssText = 'position:absolute;top:12px;right:12px;background:none;border:none;color:#8b949e;font-size:1.2rem;cursor:pointer';
          close.onclick = () => overlay.remove();
          box.appendChild(close);
          box.appendChild(renderComponent(props.contentChild));
          overlay.appendChild(box);
          overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
          document.body.appendChild(overlay);
        });
      }
      return btn;
    }

    default: {
      const el = document.createElement('div');
      el.className = 'a2ui-unknown';
      el.textContent = `[Unknown component: ${type} id=${id}]`;
      return el;
    }
  }
}

function renderChildren(childrenSpec, container) {
  if (!childrenSpec) return;
  const ids = childrenSpec.explicitList || [];
  for (const id of ids) {
    const child = renderComponent(id);
    if (child) container.appendChild(child);
  }
}

// ──────────────────────────────────────────────────────────────
// Button action handler
// ──────────────────────────────────────────────────────────────
function handleButtonClick(action) {
  const userAction = { name: action.name, context: {} };
  let msgText = 'Action: ' + action.name;

  for (const item of action.context || []) {
    const val = resolveValue(item.value);
    userAction.context[item.key] = val;
    if (item.key === 'message' && val) msgText = String(val);
  }

  sendUserAction(userAction, msgText);
}
</script>
</body>
